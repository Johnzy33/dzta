[package]
name = "toxic-waste"
version = "0.1.0"
edition = "2021"
description = "Decentralized Zero-Trust Mobile Edge Computing ZKP Engine"

# Binary entrypoint definitions
[[bin]]
name = "generate_keys"
path = "src/bin/generate_keys.rs"

[dependencies]
# --- Arkworks ZKP Cryptographic Ecosystem ---
ark-ff = "0.6.0"
ark-ec = "0.6.0"
ark-bls12-381 = "0.6.0"
ark-groth16 = "0.6.0"
ark-snark = { version = "0.6", default-features = false }
ark-relations = "0.6.0"
ark-r1cs-std = "0.6.0"
ark-serialize = "0.6.0"

# --- Math & Hashing ---
num-bigint = "0.5.1"
num-traits = "0.2"
sha2 = "0.11.0"
rand = "0.10.2"
rand_chacha = "0.3"

# --- Serialization & JSON ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- Logging ---
log = "0.4"
env_logger = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"

# --- Async Runtime & Error Handling ---
tokio = { version = "1.35", features = ["full"] }
thiserror = "1.0"

zkp-core-crypto = { path = "../zkp-core-crypto" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"