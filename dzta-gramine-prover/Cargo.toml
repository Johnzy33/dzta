[package]
name = "dzta-gramine-prover"
version = "0.1.0"
edition = "2021"

[dependencies]
# Internal Workspace Circuit
zkp-core-crypto = { path = "../zkp-core-crypto" }
shared = { path = "../shared" }


# Arkworks Cryptography Stack (BLS12-381)
ark-bls12-381 = "0.6.0"
ark-ff = "0.6.0"
ark-groth16 = "0.6.0"
ark-serialize = "0.6.0"
ark-snark = "0.6.0"
ark-relations = "0.6.0"

# Seeded RNG & Security
rand_chacha = "0.3"
zeroize = { version = "1.8", features = ["zeroize_derive"] }

# Serialization & System
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.23.1"
hex = "0.4"
num-bigint = "0.5.1"
num-traits = "0.2"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
sha2 = "0.11.0"