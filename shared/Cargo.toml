[package]
name = "shared"
version = "0.1.0"
edition = "2021"

[dependencies]

# Cryptography
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
async-trait = "0.1.77"
tokio = { version = "1.35", features = ["full"] }
uuid = { version = "1.23.4", features = ["v4", "serde"] }
log = "0.4.33"
env_logger = "0.11.11"
anyhow = "1.0.103"
thiserror = "2.0.18"
num-bigint = "0.4.3"
getrandom = "0.2.10"
num-traits = "0.2.15"
ark-groth16 = { version = "0.6.0", default-features = false}
ark-bls12-381 = { version = "0.6", default-features = false, features = ["curve"] }
ark-snark = { version = "0.6", default-features = false }
ark-serialize = { version = "0.6", default-features = false}
ark-ff = "0.6.0"
# Utilities
zeroize = { version = "1.8", features = ["zeroize_derive"] }
chrono = "0.4"
base64 = "0.22.1"
hex = "0.4"
openssl = "0.10"
sha2 = "0.11.0"