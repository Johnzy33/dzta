[package]
name = "dzta-attestation-broker"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.77"
axum = "0.8"
base64 = "0.22.1"
dcap-qvl = { version = "0.6.3", features = ["report", "ring", "rustcrypto"] }
hex = "0.4"
sha2 = "0.11"
sha2_10 = { package = "sha2", version = "0.10" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["macros", "net", "rt-multi-thread"] }
thiserror = "2.0.18"
