[package]
name = "dzta-e2e-tests"
version = "0.1.0"
edition = "2021"

[dependencies]
fabric-client = { path = "../fabric-client" }
dzta-wallet = { path = "../dzta-wallet" }
dzta-issuer = { path = "../dzta-issuer" }
dzta-edge-wasm = { path = "../dzta-edge-wasm" }
dzta-gramine-prover = { path = "../dzta-gramine-prover" }
dzta-protected-prover = { path = "../dzta-protected-prover" }
zkp-core-crypto = { path = "../zkp-core-crypto" }
transport-engine = { path = "../transport-engine" }
shared = { path = "../shared" }
dzta-attestation-broker = { path = "../dzta-attestation-broker" }


log = "0.4.33"
tokio = { version = "1.35", features = ["full"] }
env_logger = "0.11.11"
chrono = "0.4"
aries-askar = "0.4.6"
ark-groth16 = "0.6.0"
ark-relations = "0.6.0"
ark-serialize = "0.6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand_chacha = { version = "0.3.1", default-features = false }
ark-bls12-381 = { version = "0.6", default-features = false, features = ["curve"] }
ark-std = { version = "0.6.0", default-features = false }
ark-snark = { version = "0.6", default-features = false }
hex = "0.4"
ark-ff = "0.6.0"
ark-r1cs-std = "0.6.0"
num-bigint = "0.5.1"
num-traits = "0.2"
base64 = "0.22.1"
rsa = "0.8.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8.5"
sha2 = "0.11"
sha2_10 = { package = "sha2", version = "0.10" }
axum = { version = "0.8", features = ["macros"] }