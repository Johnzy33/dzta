apiVersion: apps/v1
kind: Deployment
metadata:
  name: dzta-mec-edge-ingress
  namespace: dzta-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dzta-mec-edge-ingress
  template:
    metadata:
      labels:
        app: dzta-mec-edge-ingress
    spec:
      containers:
      # Container 1: Envoy Proxy with Wasm ZKP Verifier
      - name: envoy-zkp-proxy
        image: dzta-registry.internal/edge/enforcer:v1.0.0
        command: ["envoy"]
        args: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
        ports:
        - containerPort: 10000
          hostPort: 10000
          name: http-ingress
        - containerPort: 9099
          name: wasm-admin
        - containerPort: 9901
          name: envoy-admin
        resources:
          limits:
            memory: "512Mi"
          requests:
            memory: "256Mi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /tmp
          name: tmp-volume
        - mountPath: /etc/envoy/envoy.yaml
          subPath: envoy.yaml
          name: envoy-config-volume

      # Container 2: Fabric Revocation Daemon Sidecar
      - name: fabric-revocation-daemon
        image: dzta-registry.internal/edge/revocation-daemon:v1.0.0
        env:
        - name: FABRIC_PEER_ENDPOINT
          value: "grpcs://org1-peer1.test-network.svc.cluster.local:7051"
        - name: ENVOY_ADMIN_URL
          value: "http://127.0.0.1:9099"  # Targets Wasm loopback listener
        - name: WASM_ADMIN_TOKEN
          value: "dzta-secure-edge-admin-token-2026"
        resources:
          limits:
            memory: "128Mi"
          requests:
            memory: "64Mi"

      volumes:
      - name: tmp-volume
        emptyDir: {}
      - name: envoy-config-volume
        configMap:
          name: envoy-config