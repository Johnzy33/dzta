[package]
name = "dzta-edge-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
proxy-wasm = "0.2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"

# Arkworks crates (pure Rust crypto - WASM safe!)
ark-bls12-381 = { version = "0.6", default-features = false, features = ["curve"] }
ark-groth16 = { version = "0.6.0", default-features = false }
ark-serialize = { version = "0.6.0", default-features = false }
ark-std = { version = "0.6.0", default-features = false }

[profile.release]
opt-level = "s"       # Optimize for small binary size (reduces V8 JIT compilation time)
lto = true            # Link-Time Optimization removes unused Arkworks functions
codegen-units = 1     # Allows max optimization across crates
panic = "abort"       # Removes heavy stack-unwinding machinery
strip = true          # Strips symbols
